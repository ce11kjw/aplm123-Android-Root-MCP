name: build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      SOURCE_DATE_EPOCH: "1785340800"
      VERSION: "0.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true
      - name: Install NDK r29
        # 不用 android-actions/setup-android：它的 SDK 安装步骤依赖已移除的
        # `tools` 包，会以 "Failed to find package 'tools'" 失败。
        # runner 镜像已自带 Android SDK（/usr/local/lib/android/sdk），
        # 这里只需补装 NDK。
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMGR=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager: $SDKMGR"
          test -n "$SDKMGR" || { echo "sdkmanager not found"; exit 1; }
          yes | "$SDKMGR" --sdk_root="$SDK" "ndk;29.0.14206865" 2>&1 | tail -8
          ls "$SDK/ndk"
      - name: Build and verify
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: sh ./scripts/build-ci.sh
      - uses: actions/upload-artifact@v4
        with:
          name: aplm123-Android-Root-MCP-v0.14
          path: dist/
          if-no-files-found: error

  release:
    # 仅在推送 v* 标签时发布，避免每次 push 都产生 Release。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aplm123-Android-Root-MCP-v0.14
          path: dist
      - name: Generate update metadata
        # APatch / Magisk / KernelSU 的「检查更新」都读 module.prop 的 updateJson。
        # module.prop 固定指向 releases/latest/download/update.json，
        # 于是每次发版自动指向最新一版，不需要手工维护版本号或下载地址。
        run: |
          set -eu
          VERSION=$(sed -n 's/^version=//p' module/module.prop | head -n1)
          CODE=$(sed -n 's/^versionCode=//p' module/module.prop | head -n1)
          TAG="${GITHUB_REF_NAME}"
          BASE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          ZIP="aplm123-Android-Root-MCP-${TAG}-universal.zip"
          test -f "dist/${ZIP}"
          cp CHANGELOG.md dist/changelog.md
          {
            echo "{"
            echo "  \"version\": \"${VERSION}\","
            echo "  \"versionCode\": ${CODE},"
            echo "  \"zipUrl\": \"${BASE}/${ZIP}\","
            echo "  \"changelog\": \"${BASE}/changelog.md\""
            echo "}"
          } > dist/update.json
          cat dist/update.json
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/update.json
            dist/changelog.md
          generate_release_notes: true
          fail_on_unmatched_files: true
