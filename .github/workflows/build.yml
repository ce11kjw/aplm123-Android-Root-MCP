name: build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      SOURCE_DATE_EPOCH: "1785340800"
      VERSION: "0.09"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true
      - uses: android-actions/setup-android@v3
      - name: Install NDK r29
        run: sdkmanager "ndk;29.0.14206865"
      - name: Build and verify
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: sh ./scripts/build-ci.sh
      - uses: actions/upload-artifact@v4
        with:
          name: aplm123-Android-Root-MCP-v0.09
          path: dist/
          if-no-files-found: error

  release:
    # 仅在推送 v* 标签时发布，避免每次 push 都产生 Release。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aplm123-Android-Root-MCP-v0.09
          path: dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
