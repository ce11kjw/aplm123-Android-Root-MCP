name: build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    # 独立的第一道关卡：扫描不过就不继续构建，避免敏感内容进入构建产物与 Release。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要全部历史才能扫描「提交后又删除」的凭据。
          fetch-depth: 0
      - name: Scan working tree and history for secrets
        run: |
          python3 scripts/secret_scan.py
          python3 scripts/secret_scan.py --all

  build:
    needs: secret-scan
    runs-on: ubuntu-24.04
    env:
      SOURCE_DATE_EPOCH: "1785340800"
      VERSION: "0.09"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true
      - name: Install NDK r29
        # 不用 android-actions/setup-android：它的 SDK 安装步骤依赖已移除的
        # `tools` 包，会以 "Failed to find package 'tools'" 失败。
        # runner 镜像已自带 Android SDK（/usr/local/lib/android/sdk），
        # 这里只需补装 NDK。
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMGR=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager: $SDKMGR"
          test -n "$SDKMGR" || { echo "sdkmanager not found"; exit 1; }
          yes | "$SDKMGR" --sdk_root="$SDK" "ndk;29.0.14206865" 2>&1 | tail -8
          ls "$SDK/ndk"
      - name: Build and verify
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
        run: sh ./scripts/build-ci.sh
      - uses: actions/upload-artifact@v4
        with:
          name: aplm123-Android-Root-MCP-v0.09
          path: dist/
          if-no-files-found: error

  release:
    # 仅在推送 v* 标签时发布，避免每次 push 都产生 Release。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [secret-scan, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: aplm123-Android-Root-MCP-v0.09
          path: dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
